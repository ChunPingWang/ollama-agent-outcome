spring:
  application:
    name: ollama-agent-outcome
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ollama_agent_outcome}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: ${PORT:8080}
